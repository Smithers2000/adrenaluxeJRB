<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon — AdrenaLuxe</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #D4AF37;
    --purple: #B14EFF;
  }
  [data-theme="dark"]  { --bg: #0F0F0F; --text: #F8F8F8; --muted: rgba(248,248,248,0.65); --border: rgba(212,175,55,0.18); }
  [data-theme="light"] { --bg: #FFFFFF; --text: #222222; --muted: rgba(34,34,34,0.65);    --border: rgba(212,175,55,0.3);  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: background .35s, color .35s; }
  a { text-decoration: none; color: inherit; }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5vw; height: 68px;
    background: rgba(15,15,15,.72); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }
  [data-theme="light"] nav { background: rgba(255,255,255,.82); }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Bebas Neue', sans-serif; font-size: 1.45rem; letter-spacing: .08em; }
  .logo svg { width: 36px; height: 36px; }
  .nav-links { display: flex; gap: 2.4rem; list-style: none; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .nav-links a { color: var(--muted); transition: color .2s; }
  .nav-links a:hover { color: var(--purple); }
  .theme-toggle {
    background: none; border: 1px solid var(--border); color: var(--muted);
    width: 34px; height: 34px; border-radius: 50%; font-size: .9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: border-color .2s, color .2s;
  }
  .theme-toggle:hover { border-color: var(--gold); color: var(--gold); }

  /* Main content */
  .page {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 120px 5vw 80px; text-align: center; gap: 1.6rem;
  }

  /* Circle photo */
  .profile-circle {
    width: 260px; height: 260px; border-radius: 50%;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 6px var(--bg), 0 0 28px rgba(212,175,55,.35);
    overflow: hidden; flex-shrink: 0;
  }
  .profile-circle img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 10%; /* nudge to show the face */
  }

  /* Text */
  .label {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.4rem, 5vw, 3.4rem);
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212,175,55,.4);
  }
  .sub { font-size: .95rem; color: var(--muted); max-width: 360px; line-height: 1.65; }

  /* Button */
  .btn {
    display: inline-block;
    background: var(--gold); color: #000;
    font-weight: 700; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase;
    padding: 1rem 2.4rem; border: none; cursor: pointer;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    position: relative; z-index: 1; overflow: visible;
    transition: transform .25s ease, box-shadow .35s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px 6px rgba(212,175,55,.55), 0 0 60px 20px rgba(212,175,55,.22);
  }

  /* Footer */
  footer { background: var(--bg); padding: 32px 5vw; border-top: 1px solid var(--border); }
  .footer-row { display: flex; align-items: center; justify-content: space-between; font-size: .75rem; color: var(--muted); flex-wrap: wrap; gap: .5rem; }
  .socials { display: flex; gap: 1rem; }
  .social {
    width: 32px; height: 32px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: .75rem; color: var(--muted); cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .social:hover { border-color: var(--purple); color: var(--purple); }

  @media (max-width: 600px) {
    .nav-links { display: none; }
    .profile-circle { width: 200px; height: 200px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="16" width="5" height="8" rx="1" fill="#D4AF37"/>
      <rect x="33" y="16" width="5" height="8" rx="1" fill="#D4AF37"/>
      <rect x="7" y="14" width="3" height="12" rx="1" fill="#D4AF37"/>
      <rect x="30" y="14" width="3" height="12" rx="1" fill="#D4AF37"/>
      <rect x="10" y="19" width="20" height="2" rx="1" fill="#D4AF37" opacity="0.4"/>
      <polyline points="10,20 14,20 15.5,14 17,26 18.5,20 22,20 23.5,17 25,23 26.5,20 30,20"
        stroke="#D4AF37" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    AdrenaLuxe
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="collections.html">Collections</a></li>
    <li><a href="index.html#story">Our Story</a></li>
  </ul>
  <button class="theme-toggle" id="themeBtn">☀</button>
</nav>

<main class="page">
  <div class="profile-circle">
    <img src="athlete.png" alt="AdrenaLuxe athlete" />
  </div>

  <p class="label">Page coming soon</p>
  <p class="sub">We're still building this one out. Head back home to keep shopping the collection.</p>
  <a href="index.html" class="btn">Back to Home</a>
</main>

<footer>
  <div class="footer-row">
    <span>© 2024 AdrenaLuxe. All rights reserved.</span>
    <div class="socials">
      <div class="social">IG</div>
      <div class="social">TT</div>
      <div class="social">YT</div>
      <div class="social">X</div>
    </div>
  </div>
</footer>

<script>
  const btn = document.getElementById('themeBtn');
  btn.addEventListener('click', () => {
    const html = document.documentElement;
    const dark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', dark ? 'light' : 'dark');
    btn.textContent = dark ? '☾' : '☀';
  });
</script>
</body>
</html>
